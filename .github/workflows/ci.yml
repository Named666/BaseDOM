name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run test:types
      - run: npm run test:graph
      - run: npm run example:build
      - name: Browser integration when Chrome is installed
        run: |
          if command -v google-chrome || command -v google-chrome-stable || command -v chromium; then
            npm run test:browser
          else
            echo "Chrome is not installed on this runner; browser integration was not executed."
          fi
